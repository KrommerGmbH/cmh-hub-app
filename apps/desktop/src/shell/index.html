<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'">
  <title>cmh-hub</title>
  <link rel="stylesheet" href="./shell.css">
</head>
<body>
  <!-- 제목줄: 창 단추는 Windows 에서 OS 가 그린다(titleBarOverlay) · linux 만 셸이 그린다 -->
  <header id="titlebar" class="titlebar">
    <div class="titlebar-left">
      <span class="app-dot" aria-hidden="true"></span>
      <span class="app-name">cmh-hub</span>
      <span id="server-host" class="server-host"></span>
    </div>
    <div class="titlebar-drag" aria-hidden="true"></div>
    <div class="titlebar-right">
      <span id="pane-count" class="pane-count"></span>
      <span id="update-dot" class="update-dot" hidden title="업데이트 있음"></span>
      <div id="window-controls" class="window-controls" hidden>
        <button class="wc" data-cmd="window.minimize" aria-label="최소화"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg></button>
        <button class="wc" data-cmd="window.toggleMaximize" aria-label="최대화"><svg width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg></button>
        <button class="wc wc-close" data-cmd="window.close" aria-label="닫기"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1.1"/></svg></button>
      </div>
    </div>
  </header>

  <!-- pane 마다 탭 스트립(절대 좌표) · sash — shell.ts 가 상태를 받아 통째로 다시 그린다 -->
  <main id="panes" class="panes"></main>

  <!-- «+» 메뉴 -->
  <div id="newtab-menu" class="menu" hidden role="menu"></div>

  <!-- 업데이트 모달(G03) -->
  <div id="update-modal" class="modal" hidden>
    <div class="modal-card">
      <h2 id="update-title">업데이트</h2>
      <p id="update-text"></p>
      <div id="update-progress" class="progress" hidden><div id="update-bar" class="progress-bar"></div></div>
      <div class="modal-actions">
        <button id="update-primary" class="btn btn-primary"></button>
        <button id="update-secondary" class="btn"></button>
      </div>
    </div>
  </div>

  <template id="tab-template">
    <div class="tab" role="tab">
      <img class="tab-favicon" alt="" hidden>
      <span class="tab-spinner" hidden aria-hidden="true"></span>
      <span class="tab-title"></span>
      <button class="tab-close" aria-label="탭 닫기"><svg width="9" height="9" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1.3"/></svg></button>
    </div>
  </template>

  <template id="strip-template">
    <div class="strip" role="tablist">
      <div class="strip-tabs"></div>
      <button class="ico strip-newtab" aria-label="새 탭"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <div class="strip-spacer"></div>
      <button class="ico strip-split-right" aria-label="오른쪽으로 split (Ctrl+\)"><svg width="14" height="14" viewBox="0 0 14 14"><rect x="1" y="2" width="12" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M7 2v10" stroke="currentColor" stroke-width="1.3"/></svg></button>
      <button class="ico strip-split-down" aria-label="아래로 split (Ctrl+Shift+\)"><svg width="14" height="14" viewBox="0 0 14 14"><rect x="1" y="2" width="12" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1 7h12" stroke="currentColor" stroke-width="1.3"/></svg></button>
    </div>
  </template>

  <script type="module" src="./shell.js"></script>
</body>
</html>
