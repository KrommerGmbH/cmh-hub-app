<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'">
  <title>CMH Hub</title>
  <link rel="stylesheet" href="./shell.css">
</head>
<body>
  <!-- RD 왼쪽 사이드바(Aside 꼴 · 창 맨 위부터 · 제목줄은 그 오른쪽). 펼침 · 폭은 main(layout.json sidebar)이 정본 — shell.ts 가 상태를 받아 그린다 -->
  <aside id="sidebar" class="sidebar" hidden>
    <div class="sidebar-head">
      <div class="workspace">
        <img class="workspace-icon" src="./icon.svg" alt="" aria-hidden="true">
        <!-- 작업 공간 이름 자리 — 회사(서버) / 내 PC(로컬)는 R9 뒤 · 지금은 앱 이름 -->
        <span id="workspace-name" class="workspace-name">CMH Hub</span>
      </div>
      <div class="sidebar-head-drag" aria-hidden="true"></div>
      <button id="sidebar-collapse" class="ico sb-toggle" aria-expanded="true" aria-controls="sidebar" data-i18n-label="cmh-hub-app.sidebar.collapse"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6 2.5v11" stroke="currentColor" stroke-width="1.3"/></svg></button>
    </div>
    <nav class="sidebar-body">
      <section class="sb-section">
        <h3 class="sb-label" data-i18n="cmh-hub-app.sidebar.tabs"></h3>
        <button id="sb-new-tab" class="sb-item" aria-haspopup="menu"><span class="sb-ico"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></span><span class="sb-text" data-i18n="cmh-hub-app.sidebar.newTab"></span></button>
        <div id="sb-tab-list" class="sb-list" role="list"></div>
      </section>
      <section class="sb-section">
        <button id="sb-agent-toggle" class="sb-item sb-group" aria-expanded="false" aria-controls="sb-agent-list"><span class="sb-ico"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="3" width="13" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1.5 6h13" stroke="currentColor" stroke-width="1.3"/></svg></span><span class="sb-text" data-i18n="cmh-hub-app.sidebar.agentTabs"></span><span id="sb-agent-count" class="sb-count">0</span><span class="sb-chevron"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
        <div id="sb-agent-list" class="sb-list" role="list" hidden></div>
      </section>
      <section class="sb-section">
        <h3 class="sb-label" data-i18n="cmh-hub-app.sidebar.chats"></h3>
        <button id="sb-new-chat" class="sb-item"><span class="sb-ico"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M7.5 2.5h-4a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M12 1.8l2.2 2.2-6.4 6.4-2.8.6.6-2.8z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></span><span class="sb-text" data-i18n="cmh-hub-app.sidebar.newChat"></span></button>
        <!-- 대화 목록(cmh_ai_conversation)은 R6 뒤 — 지금은 비어 있다 -->
        <div id="sb-chat-list" class="sb-list" role="list"></div>
      </section>
    </nav>
    <div class="sidebar-foot">
      <!-- 설정 화면은 R7 — 아직 동작 없음 -->
      <button id="sb-settings" class="sb-item" disabled><span class="sb-ico"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.8v1.8M8 12.4v1.8M1.8 8h1.8M12.4 8h1.8M3.6 3.6l1.3 1.3M11.1 11.1l1.3 1.3M3.6 12.4l1.3-1.3M11.1 4.9l1.3-1.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></span><span class="sb-text" data-i18n="cmh-hub-app.sidebar.settings"></span></button>
    </div>
    <!-- 폭 끌기(180~400 · main 이 자른다) · 키보드 ← → (shell.ts) -->
    <div id="sidebar-resizer" class="sidebar-resizer" role="separator" aria-orientation="vertical" aria-controls="sidebar" aria-valuemin="180" aria-valuemax="400" tabindex="0" data-i18n-label="cmh-hub-app.sidebar.resize"></div>
  </aside>

  <!-- 제목줄: 창 단추는 Windows 에서 OS 가 그린다(titleBarOverlay) · linux 만 셸이 그린다 · 사이드바를 펼치면 그 오른쪽부터 -->
  <header id="titlebar" class="titlebar">
    <div class="titlebar-left">
      <!-- 사이드바가 접혔을 때만 보인다 · Agent tabs 가 있으면 수를 배지로(PLAN RD §9) -->
      <button id="sidebar-expand" class="ico sb-toggle" aria-expanded="false" aria-controls="sidebar" data-i18n-label="cmh-hub-app.sidebar.expand" hidden><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6 2.5v11" stroke="currentColor" stroke-width="1.3"/></svg><span id="sb-expand-badge" class="sb-expand-badge" hidden></span></button>
      <img class="app-icon" src="./icon.svg" alt="" aria-hidden="true">
      <span class="app-name">CMH Hub</span>
      <span id="server-host" class="server-host"></span>
    </div>
    <div class="titlebar-drag" aria-hidden="true"></div>
    <div class="titlebar-right">
      <button id="layout-button" class="ico layout-button" aria-label="레이아웃 고르기" aria-haspopup="menu" title="레이아웃 (pane 나누기)"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 2.5v11M8 8h6.5" stroke="currentColor" stroke-width="1.3"/></svg></button>
      <span id="pane-count" class="pane-count"></span>
      <span id="update-dot" class="update-dot" hidden title="업데이트 있음"></span>
      <div id="window-controls" class="window-controls" hidden>
        <button class="wc" data-cmd="window.minimize" aria-label="최소화"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg></button>
        <button class="wc" data-cmd="window.toggleMaximize" aria-label="최대화"><svg width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg></button>
        <button class="wc wc-close" data-cmd="window.close" aria-label="닫기"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1.1"/></svg></button>
      </div>
    </div>
  </header>

  <!-- pane 마다 탭 스트립(절대 좌표) · sash — shell.ts 가 상태를 받아 통째로 다시 그린다 -->
  <main id="panes" class="panes"></main>

  <!-- «+» 메뉴 -->
  <div id="newtab-menu" class="menu" hidden role="menu"></div>

  <!-- 레이아웃 고르기(2026-10-03 · 단추 하나 · 제목줄) -->
  <div id="layout-menu" class="menu layout-menu" hidden role="menu">
    <button class="menu-item layout-item" role="menuitemradio" data-preset="single" data-count="1"><svg class="layout-ico" width="22" height="16" viewBox="0 0 22 16"><rect x="1" y="1" width="20" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg><span>1단 (하나로 합치기)</span><kbd class="kbd">Ctrl+Shift+1</kbd></button>
    <button class="menu-item layout-item" role="menuitemradio" data-preset="columns2" data-count="2"><svg class="layout-ico" width="22" height="16" viewBox="0 0 22 16"><rect x="1" y="1" width="20" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M11 1v14" stroke="currentColor" stroke-width="1.3"/></svg><span>2단 좌우</span><kbd class="kbd">Ctrl+Shift+2</kbd></button>
    <button class="menu-item layout-item" role="menuitemradio" data-preset="rows2" data-count="2"><svg class="layout-ico" width="22" height="16" viewBox="0 0 22 16"><rect x="1" y="1" width="20" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1 8h20" stroke="currentColor" stroke-width="1.3"/></svg><span>2단 상하</span><kbd class="kbd">Ctrl+Shift+3</kbd></button>
    <button class="menu-item layout-item" role="menuitemradio" data-preset="top2bottom1" data-count="3"><svg class="layout-ico" width="22" height="16" viewBox="0 0 22 16"><rect x="1" y="1" width="20" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1 8h20M11 1v7" stroke="currentColor" stroke-width="1.3"/></svg><span>3단 (위 둘 · 아래 하나)</span><kbd class="kbd">Ctrl+Shift+4</kbd></button>
    <button class="menu-item layout-item" role="menuitemradio" data-preset="top1bottom2" data-count="3"><svg class="layout-ico" width="22" height="16" viewBox="0 0 22 16"><rect x="1" y="1" width="20" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1 8h20M11 8v7" stroke="currentColor" stroke-width="1.3"/></svg><span>3단 (위 하나 · 아래 둘)</span><kbd class="kbd">Ctrl+Shift+5</kbd></button>
    <button class="menu-item layout-item" role="menuitemradio" data-preset="left2right1" data-count="3"><svg class="layout-ico" width="22" height="16" viewBox="0 0 22 16"><rect x="1" y="1" width="20" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M11 1v14M1 8h10" stroke="currentColor" stroke-width="1.3"/></svg><span>3단 (왼쪽 둘 · 오른쪽 하나)</span><kbd class="kbd">Ctrl+Shift+6</kbd></button>
    <button class="menu-item layout-item" role="menuitemradio" data-preset="left1right2" data-count="3"><svg class="layout-ico" width="22" height="16" viewBox="0 0 22 16"><rect x="1" y="1" width="20" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M11 1v14M11 8h10" stroke="currentColor" stroke-width="1.3"/></svg><span>3단 (왼쪽 하나 · 오른쪽 둘)</span><kbd class="kbd">Ctrl+Shift+7</kbd></button>
    <button class="menu-item layout-item" role="menuitemradio" data-preset="grid4" data-count="4"><svg class="layout-ico" width="22" height="16" viewBox="0 0 22 16"><rect x="1" y="1" width="20" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1 8h20M11 1v14" stroke="currentColor" stroke-width="1.3"/></svg><span>4단 (2×2)</span><kbd class="kbd">Ctrl+Shift+8</kbd></button>
  </div>

  <!-- 업데이트 모달(G03) -->
  <div id="update-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="update-title">
    <div class="modal-card">
      <h2 id="update-title">업데이트</h2>
      <p id="update-text"></p>
      <div id="update-progress" class="progress" hidden><div id="update-bar" class="progress-bar"></div></div>
      <div class="modal-actions">
        <button id="update-primary" class="btn btn-primary"></button>
        <button id="update-secondary" class="btn"></button>
      </div>
    </div>
  </div>

  <template id="tab-template">
    <div class="tab" role="tab">
      <img class="tab-favicon" alt="" hidden>
      <span class="tab-spinner" hidden aria-hidden="true"></span>
      <span class="tab-title"></span>
      <button class="tab-close" aria-label="탭 닫기"><svg width="9" height="9" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1.3"/></svg></button>
    </div>
  </template>

  <!-- 사이드바 탭 줄 하나(Tabs · Agent tabs) — 탭 id 로 재사용한다(shell.ts upsertSidebarList) -->
  <template id="sb-tab-template">
    <div class="sb-item sb-tab" role="listitem">
      <span class="sb-ico"><img class="sb-favicon" alt="" hidden><span class="tab-spinner" hidden aria-hidden="true"></span><svg class="sb-globe" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M2 8h12M8 2c2 2 2 10 0 12M8 2c-2 2-2 10 0 12" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></span>
      <span class="sb-text"></span>
    </div>
  </template>

  <template id="strip-template">
    <div class="strip">
      <div class="strip-nav">
        <button class="ico strip-back" aria-label="뒤로" title="뒤로 (Alt+←)"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M12 7H2.5M6.5 3L2.5 7l4 4" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="ico strip-forward" aria-label="앞으로" title="앞으로 (Alt+→)"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 7h9.5M7.5 3l4 4-4 4" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="ico strip-reload" aria-label="새로고침" title="새로고침 (F5)"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M11.5 7A4.5 4.5 0 1 1 10.2 3.8M11.5 2v3h-3" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="strip-tabs" role="tablist"></div>
      <button class="ico strip-newtab" aria-label="새 탭"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <input class="strip-omnibox" type="text" spellcheck="false" autocomplete="off" placeholder="Google 에서 검색하거나 URL 입력" aria-label="주소 · 검색" hidden>
      <div class="strip-spacer"></div>
    </div>
  </template>

  <script type="module" src="./shell.js"></script>
</body>
</html>
