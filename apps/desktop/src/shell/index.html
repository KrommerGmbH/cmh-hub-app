<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'">
  <title>CMH Hub</title>
  <link rel="stylesheet" href="./shell.css">
</head>
<body>
  <!-- 제목줄: 창 단추는 Windows 에서 OS 가 그린다(titleBarOverlay) · linux 만 셸이 그린다 -->
  <header id="titlebar" class="titlebar">
    <div class="titlebar-left">
      <img class="app-icon" src="./icon.svg" alt="" aria-hidden="true">
      <span class="app-name">CMH Hub</span>
      <span id="server-host" class="server-host"></span>
    </div>
    <div class="titlebar-drag" aria-hidden="true"></div>
    <div class="titlebar-right">
      <button id="layout-button" class="ico layout-button" aria-label="레이아웃 고르기" aria-haspopup="menu" title="레이아웃 (pane 나누기)"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 2.5v11M8 8h6.5" stroke="currentColor" stroke-width="1.3"/></svg></button>
      <span id="pane-count" class="pane-count"></span>
      <span id="update-dot" class="update-dot" hidden title="업데이트 있음"></span>
      <div id="window-controls" class="window-controls" hidden>
        <button class="wc" data-cmd="window.minimize" aria-label="최소화"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg></button>
        <button class="wc" data-cmd="window.toggleMaximize" aria-label="최대화"><svg width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg></button>
        <button class="wc wc-close" data-cmd="window.close" aria-label="닫기"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1.1"/></svg></button>
      </div>
    </div>
  </header>

  <!-- pane 마다 탭 스트립(절대 좌표) · sash — shell.ts 가 상태를 받아 통째로 다시 그린다 -->
  <main id="panes" class="panes"></main>

  <!-- «+» 메뉴 -->
  <div id="newtab-menu" class="menu" hidden role="menu"></div>

  <!-- 레이아웃 고르기(2026-10-03 · 단추 하나 · 제목줄) -->
  <div id="layout-menu" class="menu layout-menu" hidden role="menu">
    <button class="menu-item layout-item" role="menuitem" data-preset="single" data-count="1"><svg class="layout-ico" width="22" height="16" viewBox="0 0 22 16"><rect x="1" y="1" width="20" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg><span>1단 (하나로 합치기)</span></button>
    <button class="menu-item layout-item" role="menuitem" data-preset="columns2" data-count="2"><svg class="layout-ico" width="22" height="16" viewBox="0 0 22 16"><rect x="1" y="1" width="20" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M11 1v14" stroke="currentColor" stroke-width="1.3"/></svg><span>2단 좌우</span></button>
    <button class="menu-item layout-item" role="menuitem" data-preset="rows2" data-count="2"><svg class="layout-ico" width="22" height="16" viewBox="0 0 22 16"><rect x="1" y="1" width="20" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1 8h20" stroke="currentColor" stroke-width="1.3"/></svg><span>2단 상하</span></button>
    <button class="menu-item layout-item" role="menuitem" data-preset="top2bottom1" data-count="3"><svg class="layout-ico" width="22" height="16" viewBox="0 0 22 16"><rect x="1" y="1" width="20" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1 8h20M11 1v7" stroke="currentColor" stroke-width="1.3"/></svg><span>3단 (위 둘 · 아래 하나)</span></button>
    <button class="menu-item layout-item" role="menuitem" data-preset="grid4" data-count="4"><svg class="layout-ico" width="22" height="16" viewBox="0 0 22 16"><rect x="1" y="1" width="20" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1 8h20M11 1v14" stroke="currentColor" stroke-width="1.3"/></svg><span>4단 (2×2)</span></button>
  </div>

  <!-- 업데이트 모달(G03) -->
  <div id="update-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="update-title">
    <div class="modal-card">
      <h2 id="update-title">업데이트</h2>
      <p id="update-text"></p>
      <div id="update-progress" class="progress" hidden><div id="update-bar" class="progress-bar"></div></div>
      <div class="modal-actions">
        <button id="update-primary" class="btn btn-primary"></button>
        <button id="update-secondary" class="btn"></button>
      </div>
    </div>
  </div>

  <template id="tab-template">
    <div class="tab" role="tab">
      <img class="tab-favicon" alt="" hidden>
      <span class="tab-spinner" hidden aria-hidden="true"></span>
      <span class="tab-title"></span>
      <button class="tab-close" aria-label="탭 닫기"><svg width="9" height="9" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1.3"/></svg></button>
    </div>
  </template>

  <template id="strip-template">
    <div class="strip" role="tablist">
      <div class="strip-tabs"></div>
      <button class="ico strip-newtab" aria-label="새 탭"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <div class="strip-spacer"></div>
    </div>
  </template>

  <script type="module" src="./shell.js"></script>
</body>
</html>
