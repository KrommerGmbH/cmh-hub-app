# G01 · G02 — Windows 먼저(macOS 는 서명 없이 자동 업데이트가 안 된다 · PLAN G01)
appId: de.krommer.cmh-hub-app
productName: cmh-hub
directories:
  output: release
# 경로는 apps/desktop 기준 — dist:win 은 apps/desktop 에서 돈다(projectDir · 2026-10-06 첫 빌드에서 루트 기준 경로라 main.js 가 빠짐)
files:
  - "dist/**"
  - "package.json"
  - "resources/**"
  - "!**/*.map"
extraMetadata:
  main: dist/main/main.js
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
publish:
  provider: github
  owner: KrommerGmbH
  repo: cmh-hub-app
# updateManifest 서명 키(Ed25519 · electron-updater v27 규칙)는 빌드 PC 의 .secrets/ 에 — 저장소에 넣지 않는다
# W04 — node-llama-cpp 네이티브 바이너리는 asar 밖에(문서 guide/electron.md «binaries are not packed into the asar»)
asarUnpack:
  - "**/node_modules/node-llama-cpp/**"
  - "**/node_modules/@node-llama-cpp/**"
